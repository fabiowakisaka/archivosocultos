name: Gerador Diario de Arquivos Ocultos

on:
  schedule:
    - cron: '0 6 * * *' # Roda todo dia às 06:00 UTC
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

permissions:
  contents: write

jobs:
  gerar-conteudo:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependencias
        run: pip install google-genai

      - name: Executar Gerador Python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gerador.py

      - name: Salvar Alteracoes no GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || (git commit -m "Automacao: Novo expediente e llms.txt gerados em $(date +'%Y-%m-%d %H:%M')" && git push)
